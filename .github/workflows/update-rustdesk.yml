name: Synchronize private RustDesk release

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synchronize-rustdesk-release
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Query latest release, verify SHA256SUMS, and update metadata
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
        run: ./scripts/update-release

      - name: Verify and prefetch updated release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
        run: ./scripts/fetch-release

      - name: Build both variants and allowed checks
        run: |
          nix build --print-build-logs .#x86_64-v3 .#znver5
          nix build --print-build-logs             .#checks.x86_64-linux.package-layout             .#checks.x86_64-linux.module-evaluation             .#checks.x86_64-linux.apparmor-syntax

      - name: Commit metadata to dev only
        run: |
          git add release/metadata.json
          if git diff --cached --quiet; then
            echo "Metadata is already current"
            exit 0
          fi
          version=$(python3 -c 'import json; print(json.load(open("release/metadata.json"))["version"])')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "rustdesk: synchronize ${version}"
          git push origin HEAD:dev
